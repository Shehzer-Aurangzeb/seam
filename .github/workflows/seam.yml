# Runs seam against the public Swagger Petstore, so a run proves the tool works on a machine
# that is not a developer's laptop. Manual trigger and --dry-run for now: nothing is filed yet.
name: seam

on:
  # Specs are served by deployed environments, so a merge webhook would fire before the deploy that
  # changes the spec. Polling on a schedule is less code and strictly more correct.
  schedule: [{ cron: '0 * * * *' }]
  workflow_dispatch:

# Two runs filing the same finding at once would double-open it, since the dedupe is a marker in an
# issue body that the other run has not written yet.
concurrency:
  group: seam
  cancel-in-progress: false

permissions:
  issues: write
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No version here on purpose: package.json's packageManager field pins pnpm, and
      # action-setup fails outright when both name a version.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # cwd decides which config/ directory seam reads, so the example runs from its own folder
      # while tsx and the CLI are resolved out of the checkout root.
      - name: seam sync
        working-directory: examples/petstore
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          node --import "$GITHUB_WORKSPACE/node_modules/tsx/dist/loader.mjs"
          "$GITHUB_WORKSPACE/src/cli.ts" sync
